Group=mini_ark|ARK|CareBloom
RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=Open mini_ark Navigator
ContextAction=["powershell.exe" "-NoProfile" "-ExecutionPolicy" "Bypass" "-File" "#ActionScript#" "navigator"]
